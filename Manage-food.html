
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Food - Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="food-dashboard">

        <!-- Sidebar -->

        <aside class="food-sidebar">

            <h2>Restaurant Admin </h2>

            <ul>
                <li><a href="Admin-page.html">Dashboard</a></li>
                <li><a href="Manage-food.html" class="active">Manage Food</a></li>
                <li><a href="View-order.html">View Orders</a></li>
                <li><a href="Manage-customer.html">Manage Customers</a></li>
                <li><a href="index.html">Back to Website</a></li>
            </ul>

        </aside>


        <!-- Main Content -->

        <main class="food-content">

            <!-- Header -->

            <header class="food-header">

                <div>
                    <h1>Food Management </h1>
                    <p>Manage your restaurant food items</p>
                </div>

                <a href="Admin-page.html" class="food-back-btn">
                    Back to Dashboard
                </a>

            </header>


            <!-- Add Food Form -->

            <section class="add-food">

                <h2>Add New Food</h2>

                <form id="foodForm">

                    <div class="form-group">

                        <label for="foodName">Food Name</label>

                        <input
                            type="text"
                            id="foodName"
                            placeholder="Enter food name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="foodPrice">Food Price</label>

                        <input
                            type="number"
                            id="foodPrice"
                            placeholder="Enter food price"
                            min="1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="foodCategory">Food Category</label>

                        <select id="foodCategory" required>

                            <option value="">Select Category</option>
                            <option value="Burger">Burger</option>
                            <option value="Pizza">Pizza</option>
                            <option value="Salad">Salad</option>
                            <option value="Snacks">Snacks</option>
                            <option value="Drinks">Drinks</option>

                        </select>

                    </div>


                    <button type="submit" id="addFoodBtn">
                        + Add Food
                    </button>

                </form>

            </section>


            <!-- Food List -->

            <section class="food-list">

                <h2>All Food Items</h2>

                <div class="food-table-wrapper">

                    <table>

                        <thead>

                            <tr>
                                <th>#</th>
                                <th>Food Name</th>
                                <th>Price</th>
                                <th>Category</th>
                                <th>Action</th>
                            </tr>

                        </thead>

                        <tbody id="foodTable">
                            <!-- JavaScript will display food here -->
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="food.js"></script>

</body>
</html>
